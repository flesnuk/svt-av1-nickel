name: auto build

on:
  workflow_dispatch:
    branches: [ "master", "main" ]
  push:
    branches: [ "master", "main" ]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              name: "Windows_Optimized",
              os: windows-2022,
              generators: "Ninja",
              msvc_arch: x64,
              c_compiler: clang,
              cpp_compiler: clang++,
              march: "znver3"
            }
    env:
      CMAKE_GENERATOR: "${{ matrix.config.generators }}"
    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/setup-nasm@v1
    - name: Download and prepare FFMS2 (Windows)
      if: contains( matrix.config.os, 'windows' )
      run: |
        curl -L -o ffms2-5.0-msvc.7z https://github.com/FFMS/ffms2/releases/download/5.0/ffms2-5.0-msvc.7z
        7z x ffms2-5.0-msvc.7z
        mkdir -p third_party/ffms2/include
        mkdir -p third_party/ffms2/lib
        cp ffms2-5.0-msvc/include/ffms.h third_party/ffms2/include/
        cp ffms2-5.0-msvc/x64/ffms2.lib third_party/ffms2/lib/
        mkdir -p Bin/Release
        cp ffms2-5.0-msvc/x64/ffms2.dll Bin/Release/
      shell: bash
    - name: Windows build
      if: contains( matrix.config.os, 'windows' )
      run: |
        set CC=clang
        set CXX=clang++
        cmake --fresh -B svt_build -G Ninja -DUSE_FFMS2=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DSVT_AV1_LTO=OFF -DENABLE_AVX512=ON -DCMAKE_C_FLAGS_RELEASE="-flto -march=${{ matrix.config.march }} -O2 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-march=${{ matrix.config.march }} -O2 -DNDEBUG" -DREPRODUCIBLE_BUILDS=ON
        ninja -C svt_build
      shell: cmd
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.config.name }}
        path: Bin/Release/
        retention-days: 90

    - name: Get latest release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: latest_release
      uses: actions/github-script@v7
      with:
        result-encoding: string
        script: |
          const release = await github.rest.repos.getLatestRelease({
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          console.log('Latest release tag:', release.data.tag_name);
          return release.data.tag_name;

    - name: Upload binaries to existing release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          const tag = '${{ steps.latest_release.outputs.result }}';
          console.log('Using tag:', tag);

          // Get the existing release
          const release = await github.rest.repos.getReleaseByTag({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag: tag
          });

          // Extract version without leading "v" if present
          const version = tag.startsWith('v') ? tag.slice(1) : tag;

          // Find binary files (executables only, not .a files)
          const binDir = 'Bin/Release';
          const files = fs.readdirSync(binDir);
          const binaries = files.filter(file => {
            const ext = path.extname(file).toLowerCase();
            return !ext || ext === '.exe' || ext === '.dll'; // No extension (Unix) or .exe/.dll (Windows)
          });

          console.log('Found binaries:', binaries);
          
          // Upload each binary
          for (const binary of binaries) {
            const filePath = path.join(binDir, binary);
            const ext = path.extname(binary);
            const base = path.basename(binary, ext);
            const fileName = `${base}-${version}-${{ matrix.config.name }}${ext}`;

            console.log(`Uploading ${fileName}...`);

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: fileName,
              data: fs.readFileSync(filePath)
            });
          }